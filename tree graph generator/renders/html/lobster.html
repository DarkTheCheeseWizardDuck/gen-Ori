<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>lobster</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>lobster &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="700" height="633" viewBox="0 0 700 633">
<g class="edge-group"><line x1="215.7" y1="316.7" x2="436.6" y2="316.7" stroke="#1C2541" stroke-width="2.5"/><line x1="215.7" y1="316.7" x2="436.6" y2="316.7" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="215.7" y1="316.7" x2="144.2" y2="583.5" stroke="#1C2541" stroke-width="2.5"/><line x1="215.7" y1="316.7" x2="144.2" y2="583.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'claw')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="215.7" y1="316.7" x2="50.0" y2="316.7" stroke="#1C2541" stroke-width="2.5"/><line x1="215.7" y1="316.7" x2="50.0" y2="316.7" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'head')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="215.7" y1="316.7" x2="144.2" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="215.7" y1="316.7" x2="144.2" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'claw')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="436.6" y1="316.7" x2="465.2" y2="210.0" stroke="#1C2541" stroke-width="2.5"/><line x1="436.6" y1="316.7" x2="465.2" y2="210.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="436.6" y1="316.7" x2="514.7" y2="238.6" stroke="#1C2541" stroke-width="2.5"/><line x1="436.6" y1="316.7" x2="514.7" y2="238.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="436.6" y1="316.7" x2="650.0" y2="259.6" stroke="#1C2541" stroke-width="2.5"/><line x1="436.6" y1="316.7" x2="650.0" y2="259.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="436.6" y1="316.7" x2="650.0" y2="373.9" stroke="#1C2541" stroke-width="2.5"/><line x1="436.6" y1="316.7" x2="650.0" y2="373.9" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'tail')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="436.6" y1="316.7" x2="514.7" y2="394.8" stroke="#1C2541" stroke-width="2.5"/><line x1="436.6" y1="316.7" x2="514.7" y2="394.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="436.6" y1="316.7" x2="465.2" y2="423.4" stroke="#1C2541" stroke-width="2.5"/><line x1="436.6" y1="316.7" x2="465.2" y2="423.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><circle cx="215.7" cy="316.7" r="5" fill="#E8871E"/><circle cx="436.6" cy="316.7" r="5" fill="#E8871E"/><circle cx="144.2" cy="583.5" r="5" fill="#E8871E"/><circle cx="50.0" cy="316.7" r="5" fill="#E8871E"/><circle cx="144.2" cy="50.0" r="5" fill="#E8871E"/><circle cx="465.2" cy="210.0" r="5" fill="#E8871E"/><circle cx="514.7" cy="238.6" r="5" fill="#E8871E"/><circle cx="650.0" cy="259.6" r="5" fill="#E8871E"/><circle cx="650.0" cy="373.9" r="5" fill="#E8871E"/><circle cx="514.7" cy="394.8" r="5" fill="#E8871E"/><circle cx="465.2" cy="423.4" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
