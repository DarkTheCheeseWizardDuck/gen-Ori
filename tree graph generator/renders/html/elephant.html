<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>elephant</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>elephant &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="700" height="521" viewBox="0 0 700 521">
<g class="edge-group"><line x1="250.4" y1="260.5" x2="541.0" y2="260.5" stroke="#1C2541" stroke-width="2.5"/><line x1="250.4" y1="260.5" x2="541.0" y2="260.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="250.4" y1="260.5" x2="68.8" y2="260.5" stroke="#1C2541" stroke-width="2.5"/><line x1="250.4" y1="260.5" x2="68.8" y2="260.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'head')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="68.8" y1="260.5" x2="50.0" y2="330.7" stroke="#1C2541" stroke-width="2.5"/><line x1="68.8" y1="260.5" x2="50.0" y2="330.7" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'tusk')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="68.8" y1="260.5" x2="50.0" y2="190.3" stroke="#1C2541" stroke-width="2.5"/><line x1="68.8" y1="260.5" x2="50.0" y2="190.3" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'tusk')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="250.4" y1="260.5" x2="194.0" y2="471.0" stroke="#1C2541" stroke-width="2.5"/><line x1="250.4" y1="260.5" x2="194.0" y2="471.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="250.4" y1="260.5" x2="194.0" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="250.4" y1="260.5" x2="194.0" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="541.0" y1="260.5" x2="650.0" y2="260.5" stroke="#1C2541" stroke-width="2.5"/><line x1="541.0" y1="260.5" x2="650.0" y2="260.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'tail')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="541.0" y1="260.5" x2="597.4" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="541.0" y1="260.5" x2="597.4" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="541.0" y1="260.5" x2="597.4" y2="471.0" stroke="#1C2541" stroke-width="2.5"/><line x1="541.0" y1="260.5" x2="597.4" y2="471.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><circle cx="250.4" cy="260.5" r="5" fill="#E8871E"/><circle cx="541.0" cy="260.5" r="5" fill="#E8871E"/><circle cx="68.8" cy="260.5" r="5" fill="#E8871E"/><circle cx="50.0" cy="330.7" r="5" fill="#E8871E"/><circle cx="50.0" cy="190.3" r="5" fill="#E8871E"/><circle cx="194.0" cy="471.0" r="5" fill="#E8871E"/><circle cx="194.0" cy="50.0" r="5" fill="#E8871E"/><circle cx="650.0" cy="260.5" r="5" fill="#E8871E"/><circle cx="597.4" cy="50.0" r="5" fill="#E8871E"/><circle cx="597.4" cy="471.0" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
