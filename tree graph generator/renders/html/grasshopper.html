<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>grasshopper</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>grasshopper &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="700" height="658" viewBox="0 0 700 658">
<g class="edge-group"><line x1="173.7" y1="368.6" x2="379.8" y2="368.6" stroke="#1C2541" stroke-width="2.5"/><line x1="173.7" y1="368.6" x2="379.8" y2="368.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="173.7" y1="368.6" x2="109.7" y2="607.5" stroke="#1C2541" stroke-width="2.5"/><line x1="173.7" y1="368.6" x2="109.7" y2="607.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="173.7" y1="368.6" x2="50.0" y2="368.6" stroke="#1C2541" stroke-width="2.5"/><line x1="173.7" y1="368.6" x2="50.0" y2="368.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'head')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="173.7" y1="368.6" x2="195.8" y2="286.2" stroke="#1C2541" stroke-width="2.5"/><line x1="173.7" y1="368.6" x2="195.8" y2="286.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'antenna')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="173.7" y1="368.6" x2="195.8" y2="451.0" stroke="#1C2541" stroke-width="2.5"/><line x1="173.7" y1="368.6" x2="195.8" y2="451.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'antenna')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="173.7" y1="368.6" x2="109.7" y2="129.6" stroke="#1C2541" stroke-width="2.5"/><line x1="173.7" y1="368.6" x2="109.7" y2="129.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="379.8" y1="368.6" x2="465.2" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="379.8" y1="368.6" x2="465.2" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="379.8" y1="368.6" x2="576.1" y2="218.0" stroke="#1C2541" stroke-width="2.5"/><line x1="379.8" y1="368.6" x2="576.1" y2="218.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="379.8" y1="368.6" x2="586.0" y2="368.6" stroke="#1C2541" stroke-width="2.5"/><line x1="379.8" y1="368.6" x2="586.0" y2="368.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="586.0" y1="368.6" x2="650.0" y2="129.6" stroke="#1C2541" stroke-width="2.5"/><line x1="586.0" y1="368.6" x2="650.0" y2="129.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="586.0" y1="368.6" x2="650.0" y2="607.5" stroke="#1C2541" stroke-width="2.5"/><line x1="586.0" y1="368.6" x2="650.0" y2="607.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="379.8" y1="368.6" x2="641.5" y2="569.4" stroke="#1C2541" stroke-width="2.5"/><line x1="379.8" y1="368.6" x2="641.5" y2="569.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="379.8" y1="368.6" x2="443.9" y2="607.5" stroke="#1C2541" stroke-width="2.5"/><line x1="379.8" y1="368.6" x2="443.9" y2="607.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><circle cx="173.7" cy="368.6" r="5" fill="#E8871E"/><circle cx="379.8" cy="368.6" r="5" fill="#E8871E"/><circle cx="109.7" cy="607.5" r="5" fill="#E8871E"/><circle cx="50.0" cy="368.6" r="5" fill="#E8871E"/><circle cx="195.8" cy="286.2" r="5" fill="#E8871E"/><circle cx="195.8" cy="451.0" r="5" fill="#E8871E"/><circle cx="109.7" cy="129.6" r="5" fill="#E8871E"/><circle cx="465.2" cy="50.0" r="5" fill="#E8871E"/><circle cx="576.1" cy="218.0" r="5" fill="#E8871E"/><circle cx="586.0" cy="368.6" r="5" fill="#E8871E"/><circle cx="650.0" cy="129.6" r="5" fill="#E8871E"/><circle cx="650.0" cy="607.5" r="5" fill="#E8871E"/><circle cx="641.5" cy="569.4" r="5" fill="#E8871E"/><circle cx="443.9" cy="607.5" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
