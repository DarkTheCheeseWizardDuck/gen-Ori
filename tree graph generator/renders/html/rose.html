<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>rose</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>rose &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="700" height="348" viewBox="0 0 700 348">
<g class="edge-group"><line x1="178.6" y1="174.2" x2="650.0" y2="174.2" stroke="#1C2541" stroke-width="2.5"/><line x1="178.6" y1="174.2" x2="650.0" y2="174.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'stem')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="178.6" y1="174.2" x2="145.3" y2="298.4" stroke="#1C2541" stroke-width="2.5"/><line x1="178.6" y1="174.2" x2="145.3" y2="298.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'pedal')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="178.6" y1="174.2" x2="76.6" y2="252.5" stroke="#1C2541" stroke-width="2.5"/><line x1="178.6" y1="174.2" x2="76.6" y2="252.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'pedal')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="178.6" y1="174.2" x2="50.0" y2="174.2" stroke="#1C2541" stroke-width="2.5"/><line x1="178.6" y1="174.2" x2="50.0" y2="174.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'pedal')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="178.6" y1="174.2" x2="76.6" y2="95.9" stroke="#1C2541" stroke-width="2.5"/><line x1="178.6" y1="174.2" x2="76.6" y2="95.9" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'pedal')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="178.6" y1="174.2" x2="145.3" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="178.6" y1="174.2" x2="145.3" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'pedal')" onmouseleave="hideTip()"/></g><circle cx="178.6" cy="174.2" r="5" fill="#E8871E"/><circle cx="650.0" cy="174.2" r="5" fill="#E8871E"/><circle cx="145.3" cy="298.4" r="5" fill="#E8871E"/><circle cx="76.6" cy="252.5" r="5" fill="#E8871E"/><circle cx="50.0" cy="174.2" r="5" fill="#E8871E"/><circle cx="76.6" cy="95.9" r="5" fill="#E8871E"/><circle cx="145.3" cy="50.0" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
