<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>camel</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>camel &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="700" height="430" viewBox="0 0 700 430">
<g class="edge-group"><line x1="178.2" y1="215.2" x2="392.0" y2="215.2" stroke="#1C2541" stroke-width="2.5"/><line x1="178.2" y1="215.2" x2="392.0" y2="215.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="178.2" y1="215.2" x2="50.0" y2="215.2" stroke="#1C2541" stroke-width="2.5"/><line x1="178.2" y1="215.2" x2="50.0" y2="215.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'head')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="178.2" y1="215.2" x2="134.0" y2="380.3" stroke="#1C2541" stroke-width="2.5"/><line x1="178.2" y1="215.2" x2="134.0" y2="380.3" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="178.2" y1="215.2" x2="178.2" y2="129.7" stroke="#1C2541" stroke-width="2.5"/><line x1="178.2" y1="215.2" x2="178.2" y2="129.7" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'hump')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="178.2" y1="215.2" x2="134.0" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="178.2" y1="215.2" x2="134.0" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="392.0" y1="215.2" x2="605.7" y2="215.2" stroke="#1C2541" stroke-width="2.5"/><line x1="392.0" y1="215.2" x2="605.7" y2="215.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="605.7" y1="215.2" x2="650.0" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="605.7" y1="215.2" x2="650.0" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="605.7" y1="215.2" x2="650.0" y2="380.3" stroke="#1C2541" stroke-width="2.5"/><line x1="605.7" y1="215.2" x2="650.0" y2="380.3" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="392.0" y1="215.2" x2="392.0" y2="300.7" stroke="#1C2541" stroke-width="2.5"/><line x1="392.0" y1="215.2" x2="392.0" y2="300.7" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'hump')" onmouseleave="hideTip()"/></g><circle cx="178.2" cy="215.2" r="5" fill="#E8871E"/><circle cx="392.0" cy="215.2" r="5" fill="#E8871E"/><circle cx="50.0" cy="215.2" r="5" fill="#E8871E"/><circle cx="134.0" cy="380.3" r="5" fill="#E8871E"/><circle cx="178.2" cy="129.7" r="5" fill="#E8871E"/><circle cx="134.0" cy="50.0" r="5" fill="#E8871E"/><circle cx="605.7" cy="215.2" r="5" fill="#E8871E"/><circle cx="650.0" cy="50.0" r="5" fill="#E8871E"/><circle cx="650.0" cy="380.3" r="5" fill="#E8871E"/><circle cx="392.0" cy="300.7" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
