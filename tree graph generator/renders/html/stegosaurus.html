<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>stegosaurus</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>stegosaurus &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="621" height="700" viewBox="0 0 621 700">
<g class="edge-group"><line x1="147.8" y1="491.2" x2="353.2" y2="491.2" stroke="#1C2541" stroke-width="2.5"/><line x1="147.8" y1="491.2" x2="353.2" y2="491.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="147.8" y1="491.2" x2="105.3" y2="650.0" stroke="#1C2541" stroke-width="2.5"/><line x1="147.8" y1="491.2" x2="105.3" y2="650.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="147.8" y1="491.2" x2="50.0" y2="566.3" stroke="#1C2541" stroke-width="2.5"/><line x1="147.8" y1="491.2" x2="50.0" y2="566.3" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'head')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="147.8" y1="491.2" x2="98.5" y2="491.2" stroke="#1C2541" stroke-width="2.5"/><line x1="147.8" y1="491.2" x2="98.5" y2="491.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'spike')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="147.8" y1="491.2" x2="108.7" y2="461.2" stroke="#1C2541" stroke-width="2.5"/><line x1="147.8" y1="491.2" x2="108.7" y2="461.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'spike')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="147.8" y1="491.2" x2="105.3" y2="332.5" stroke="#1C2541" stroke-width="2.5"/><line x1="147.8" y1="491.2" x2="105.3" y2="332.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="353.2" y1="491.2" x2="406.4" y2="292.8" stroke="#1C2541" stroke-width="2.5"/><line x1="353.2" y1="491.2" x2="406.4" y2="292.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="406.4" y1="292.8" x2="264.1" y2="210.6" stroke="#1C2541" stroke-width="2.5"/><line x1="406.4" y1="292.8" x2="264.1" y2="210.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="406.4" y1="292.8" x2="363.6" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="406.4" y1="292.8" x2="363.6" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'tail')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="406.4" y1="292.8" x2="438.1" y2="255.0" stroke="#1C2541" stroke-width="2.5"/><line x1="406.4" y1="292.8" x2="438.1" y2="255.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'spike')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="406.4" y1="292.8" x2="570.8" y2="292.8" stroke="#1C2541" stroke-width="2.5"/><line x1="406.4" y1="292.8" x2="570.8" y2="292.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="353.2" y1="491.2" x2="402.6" y2="491.2" stroke="#1C2541" stroke-width="2.5"/><line x1="353.2" y1="491.2" x2="402.6" y2="491.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'spike')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="353.2" y1="491.2" x2="366.0" y2="538.9" stroke="#1C2541" stroke-width="2.5"/><line x1="353.2" y1="491.2" x2="366.0" y2="538.9" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'spike')" onmouseleave="hideTip()"/></g><circle cx="147.8" cy="491.2" r="5" fill="#E8871E"/><circle cx="353.2" cy="491.2" r="5" fill="#E8871E"/><circle cx="105.3" cy="650.0" r="5" fill="#E8871E"/><circle cx="50.0" cy="566.3" r="5" fill="#E8871E"/><circle cx="98.5" cy="491.2" r="5" fill="#E8871E"/><circle cx="108.7" cy="461.2" r="5" fill="#E8871E"/><circle cx="105.3" cy="332.5" r="5" fill="#E8871E"/><circle cx="406.4" cy="292.8" r="5" fill="#E8871E"/><circle cx="264.1" cy="210.6" r="5" fill="#E8871E"/><circle cx="363.6" cy="50.0" r="5" fill="#E8871E"/><circle cx="438.1" cy="255.0" r="5" fill="#E8871E"/><circle cx="570.8" cy="292.8" r="5" fill="#E8871E"/><circle cx="402.6" cy="491.2" r="5" fill="#E8871E"/><circle cx="366.0" cy="538.9" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
