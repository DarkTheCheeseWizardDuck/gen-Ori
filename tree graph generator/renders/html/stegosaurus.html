<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>stegosaurus</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>stegosaurus &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="700" height="344" viewBox="0 0 700 344">
<g class="edge-group"><line x1="144.7" y1="172.0" x2="302.6" y2="172.0" stroke="#1C2541" stroke-width="2.5"/><line x1="144.7" y1="172.0" x2="302.6" y2="172.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="144.7" y1="172.0" x2="50.0" y2="172.0" stroke="#1C2541" stroke-width="2.5"/><line x1="144.7" y1="172.0" x2="50.0" y2="172.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'head')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="144.7" y1="172.0" x2="112.0" y2="294.0" stroke="#1C2541" stroke-width="2.5"/><line x1="144.7" y1="172.0" x2="112.0" y2="294.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="144.7" y1="172.0" x2="110.4" y2="188.0" stroke="#1C2541" stroke-width="2.5"/><line x1="144.7" y1="172.0" x2="110.4" y2="188.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'spike')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="144.7" y1="172.0" x2="110.4" y2="156.0" stroke="#1C2541" stroke-width="2.5"/><line x1="144.7" y1="172.0" x2="110.4" y2="156.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'spike')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="144.7" y1="172.0" x2="112.0" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="144.7" y1="172.0" x2="112.0" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="302.6" y1="172.0" x2="460.5" y2="172.0" stroke="#1C2541" stroke-width="2.5"/><line x1="302.6" y1="172.0" x2="460.5" y2="172.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="460.5" y1="172.0" x2="650.0" y2="172.0" stroke="#1C2541" stroke-width="2.5"/><line x1="460.5" y1="172.0" x2="650.0" y2="172.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'tail')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="460.5" y1="172.0" x2="493.2" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="460.5" y1="172.0" x2="493.2" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="460.5" y1="172.0" x2="460.5" y2="209.9" stroke="#1C2541" stroke-width="2.5"/><line x1="460.5" y1="172.0" x2="460.5" y2="209.9" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'spike')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="460.5" y1="172.0" x2="493.2" y2="294.0" stroke="#1C2541" stroke-width="2.5"/><line x1="460.5" y1="172.0" x2="493.2" y2="294.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="302.6" y1="172.0" x2="312.4" y2="135.4" stroke="#1C2541" stroke-width="2.5"/><line x1="302.6" y1="172.0" x2="312.4" y2="135.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'spike')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="302.6" y1="172.0" x2="312.4" y2="208.6" stroke="#1C2541" stroke-width="2.5"/><line x1="302.6" y1="172.0" x2="312.4" y2="208.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'spike')" onmouseleave="hideTip()"/></g><circle cx="144.7" cy="172.0" r="5" fill="#E8871E"/><circle cx="302.6" cy="172.0" r="5" fill="#E8871E"/><circle cx="50.0" cy="172.0" r="5" fill="#E8871E"/><circle cx="112.0" cy="294.0" r="5" fill="#E8871E"/><circle cx="110.4" cy="188.0" r="5" fill="#E8871E"/><circle cx="110.4" cy="156.0" r="5" fill="#E8871E"/><circle cx="112.0" cy="50.0" r="5" fill="#E8871E"/><circle cx="460.5" cy="172.0" r="5" fill="#E8871E"/><circle cx="650.0" cy="172.0" r="5" fill="#E8871E"/><circle cx="493.2" cy="50.0" r="5" fill="#E8871E"/><circle cx="460.5" cy="209.9" r="5" fill="#E8871E"/><circle cx="493.2" cy="294.0" r="5" fill="#E8871E"/><circle cx="312.4" cy="135.4" r="5" fill="#E8871E"/><circle cx="312.4" cy="208.6" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
