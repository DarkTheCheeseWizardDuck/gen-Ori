<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>chinese_dragon</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>chinese_dragon &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="700" height="161" viewBox="0 0 700 161">
<g class="edge-group"><line x1="144.7" y1="80.5" x2="271.1" y2="80.5" stroke="#1C2541" stroke-width="2.5"/><line x1="144.7" y1="80.5" x2="271.1" y2="80.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="144.7" y1="80.5" x2="50.0" y2="80.5" stroke="#1C2541" stroke-width="2.5"/><line x1="144.7" y1="80.5" x2="50.0" y2="80.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'head')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="271.1" y1="80.5" x2="397.4" y2="80.5" stroke="#1C2541" stroke-width="2.5"/><line x1="271.1" y1="80.5" x2="397.4" y2="80.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="397.4" y1="80.5" x2="405.5" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="397.4" y1="80.5" x2="405.5" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="397.4" y1="80.5" x2="422.4" y2="61.3" stroke="#1C2541" stroke-width="2.5"/><line x1="397.4" y1="80.5" x2="422.4" y2="61.3" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="397.4" y1="80.5" x2="523.7" y2="80.5" stroke="#1C2541" stroke-width="2.5"/><line x1="397.4" y1="80.5" x2="523.7" y2="80.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="523.7" y1="80.5" x2="650.0" y2="80.5" stroke="#1C2541" stroke-width="2.5"/><line x1="523.7" y1="80.5" x2="650.0" y2="80.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'tail')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="397.4" y1="80.5" x2="422.4" y2="99.7" stroke="#1C2541" stroke-width="2.5"/><line x1="397.4" y1="80.5" x2="422.4" y2="99.7" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="397.4" y1="80.5" x2="405.5" y2="111.0" stroke="#1C2541" stroke-width="2.5"/><line x1="397.4" y1="80.5" x2="405.5" y2="111.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><circle cx="144.7" cy="80.5" r="5" fill="#E8871E"/><circle cx="271.1" cy="80.5" r="5" fill="#E8871E"/><circle cx="50.0" cy="80.5" r="5" fill="#E8871E"/><circle cx="397.4" cy="80.5" r="5" fill="#E8871E"/><circle cx="405.5" cy="50.0" r="5" fill="#E8871E"/><circle cx="422.4" cy="61.3" r="5" fill="#E8871E"/><circle cx="523.7" cy="80.5" r="5" fill="#E8871E"/><circle cx="650.0" cy="80.5" r="5" fill="#E8871E"/><circle cx="422.4" cy="99.7" r="5" fill="#E8871E"/><circle cx="405.5" cy="111.0" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
