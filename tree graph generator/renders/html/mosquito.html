<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>mosquito</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>mosquito &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="700" height="294" viewBox="0 0 700 294">
<g class="edge-group"><line x1="142.2" y1="168.8" x2="388.2" y2="168.8" stroke="#1C2541" stroke-width="2.5"/><line x1="142.2" y1="168.8" x2="388.2" y2="168.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="142.2" y1="168.8" x2="131.0" y2="210.6" stroke="#1C2541" stroke-width="2.5"/><line x1="142.2" y1="168.8" x2="131.0" y2="210.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="142.2" y1="168.8" x2="50.0" y2="168.8" stroke="#1C2541" stroke-width="2.5"/><line x1="142.2" y1="168.8" x2="50.0" y2="168.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'head')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="142.2" y1="168.8" x2="153.4" y2="126.9" stroke="#1C2541" stroke-width="2.5"/><line x1="142.2" y1="168.8" x2="153.4" y2="126.9" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'antenna')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="142.2" y1="168.8" x2="388.2" y2="168.8" stroke="#1C2541" stroke-width="2.5"/><line x1="142.2" y1="168.8" x2="388.2" y2="168.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'bill')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="142.2" y1="168.8" x2="153.4" y2="210.6" stroke="#1C2541" stroke-width="2.5"/><line x1="142.2" y1="168.8" x2="153.4" y2="210.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'antenna')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="142.2" y1="168.8" x2="131.0" y2="126.9" stroke="#1C2541" stroke-width="2.5"/><line x1="142.2" y1="168.8" x2="131.0" y2="126.9" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="388.2" y1="168.8" x2="420.0" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="388.2" y1="168.8" x2="420.0" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="388.2" y1="168.8" x2="436.9" y2="131.3" stroke="#1C2541" stroke-width="2.5"/><line x1="388.2" y1="168.8" x2="436.9" y2="131.3" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="388.2" y1="168.8" x2="634.1" y2="168.8" stroke="#1C2541" stroke-width="2.5"/><line x1="388.2" y1="168.8" x2="634.1" y2="168.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="634.1" y1="168.8" x2="650.0" y2="109.4" stroke="#1C2541" stroke-width="2.5"/><line x1="634.1" y1="168.8" x2="650.0" y2="109.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="634.1" y1="168.8" x2="650.0" y2="228.2" stroke="#1C2541" stroke-width="2.5"/><line x1="634.1" y1="168.8" x2="650.0" y2="228.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="388.2" y1="168.8" x2="485.7" y2="243.6" stroke="#1C2541" stroke-width="2.5"/><line x1="388.2" y1="168.8" x2="485.7" y2="243.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="388.2" y1="168.8" x2="404.1" y2="228.2" stroke="#1C2541" stroke-width="2.5"/><line x1="388.2" y1="168.8" x2="404.1" y2="228.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><circle cx="142.2" cy="168.8" r="5" fill="#E8871E"/><circle cx="388.2" cy="168.8" r="5" fill="#E8871E"/><circle cx="131.0" cy="210.6" r="5" fill="#E8871E"/><circle cx=" </svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
