<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>scorpion</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>scorpion &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="700" height="203" viewBox="0 0 700 203">
<g class="edge-group"><line x1="114.7" y1="84.5" x2="221.8" y2="84.5" stroke="#1C2541" stroke-width="2.5"/><line x1="114.7" y1="84.5" x2="221.8" y2="84.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="114.7" y1="84.5" x2="96.2" y2="153.4" stroke="#1C2541" stroke-width="2.5"/><line x1="114.7" y1="84.5" x2="96.2" y2="153.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'claw')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="114.7" y1="84.5" x2="82.3" y2="99.6" stroke="#1C2541" stroke-width="2.5"/><line x1="114.7" y1="84.5" x2="82.3" y2="99.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="114.7" y1="84.5" x2="50.0" y2="54.3" stroke="#1C2541" stroke-width="2.5"/><line x1="114.7" y1="84.5" x2="50.0" y2="54.3" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'claw')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="114.7" y1="84.5" x2="105.5" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="114.7" y1="84.5" x2="105.5" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="221.8" y1="84.5" x2="231.0" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="221.8" y1="84.5" x2="231.0" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="221.8" y1="84.5" x2="328.8" y2="84.5" stroke="#1C2541" stroke-width="2.5"/><line x1="221.8" y1="84.5" x2="328.8" y2="84.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="328.8" y1="84.5" x2="338.0" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="328.8" y1="84.5" x2="338.0" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="328.8" y1="84.5" x2="435.9" y2="84.5" stroke="#1C2541" stroke-width="2.5"/><line x1="328.8" y1="84.5" x2="435.9" y2="84.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="435.9" y1="84.5" x2="445.1" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="435.9" y1="84.5" x2="445.1" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="435.9" y1="84.5" x2="650.0" y2="84.5" stroke="#1C2541" stroke-width="2.5"/><line x1="435.9" y1="84.5" x2="650.0" y2="84.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'tail')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="435.9" y1="84.5" x2="445.1" y2="118.9" stroke="#1C2541" stroke-width="2.5"/><line x1="435.9" y1="84.5" x2="445.1" y2="118.9" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="328.8" y1="84.5" x2="338.0" y2="118.9" stroke="#1C2541" stroke-width="2.5"/><line x1="328.8" y1="84.5" x2="338.0" y2="118.9" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="221.8" y1="84.5" x2="231.0" y2="118.9" stroke="#1C2541" stroke-width="2.5"/><line x1="221.8" y1="84.5" x2="231.0" y2="118.9" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><circle cx="114.7" cy="84.5" r="5" fill="#E8871E"/><circle cx="221.8" cy="84.5" r="5" fill="#E8871E"/><circle cx="96.2" cy="153.4" r="5" fill="#E8871E"/><circle cx="82.3" cy="99.6" r="5" fill="#E8871E"/><circle cx="50.0" cy="54.3" r="5" fill="#E8871E"/><circle cx="105.5" cy="50.0" r="5" fill="#E8871E"/><circle cx="231.0" cy="50.0" r="5" fill="#E8871E"/><circle cx="328.8" cy="84.5" r="5" fill="#E8871E"/><circle cx="338.0" cy="50.0" r="5" fill="#E8871E"/><circle cx="435.9" cy="84.5" r="5" fill="#E8871E"/><circle cx="445.1" cy="50.0" r="5" fill="#E8871E"/><circle cx="650.0" cy="84.5" r="5" fill="#E8871E"/><circle cx="445.1" cy="118.9" r="5" fill="#E8871E"/><circle cx="338.0" cy="118.9" r="5" fill="#E8871E"/><circle cx="231.0" cy="118.9" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
