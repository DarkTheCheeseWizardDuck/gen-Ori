<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ant</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>ant &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="700" height="293" viewBox="0 0 700 293">

oke-width="2.5"/><line x1="500.2" y1="146.5" x2="650.0" y2="146.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="500.2" y1="146.5" x2="519.6" y2="74.1" stroke="#1C2541" stroke-width="2.5"/><line x1="500.2" y1="146.5" x2="519.6" y2="74.1" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="500.2" y1="146.5" x2="519.6" y2="218.8" stroke="#1C2541" stroke-width="2.5"/><line x1="500.2" y1="146.5" x2="519.6" y2="218.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="350.4" y1="146.5" x2="369.8" y2="74.1" stroke="#1C2541" stroke-width="2.5"/><line x1="350.4" y1="146.5" x2="369.8" y2="74.1" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="350.4" y1="146.5" x2="369.8" y2="218.8" stroke="#1C2541" stroke-width="2.5"/><line x1="350.4" y1="146.5" x2="369.8" y2="218.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><circle cx="200.7" cy="146.5" r="5" fill="#E8871E"/><circle cx="350.4" cy="146.5" r="5" fill="#E8871E"/><circle cx="75.8" cy="146.5" r="5" fill="#E8871E"/><circle cx="50.0" cy="242.9" r="5" fill="#E8871E"/><circle cx="50.0" cy="50.0" r="5" fill="#E8871E"/><circle cx="181.3" cy="218.8" r="5" fill="#E8871E"/><circle cx="181.3" cy="74.1" r="5" fill="#E8871E"/><circle cx="500.2" cy="146.5" r="5" fill="#E8871E"/><circle cx="650.0" cy="146.5" r="5" fill="#E8871E"/><circle cx="519.6" cy="74.1" r="5" fill="#E8871E"/><circle cx="519.6" cy="218.8" r="5" fill="#E8871E"/><circle cx="369.8" cy="74.1" r="5" fill="#E8871E"/><circle cx="369.8" cy="218.8" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
