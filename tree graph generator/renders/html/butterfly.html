<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>butterfly</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>butterfly &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="700" height="692" viewBox="0 0 700 692">
<g class="edge-group"><line x1="121.1" y1="462.1" x2="263.3" y2="462.1" stroke="#1C2541" stroke-width="2.5"/><line x1="121.1" y1="462.1" x2="263.3" y2="462.1" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="121.1" y1="462.1" x2="50.0" y2="462.1" stroke="#1C2541" stroke-width="2.5"/><line x1="121.1" y1="462.1" x2="50.0" y2="462.1" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'head')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="121.1" y1="462.1" x2="189.8" y2="480.5" stroke="#1C2541" stroke-width="2.5"/><line x1="121.1" y1="462.1" x2="189.8" y2="480.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'antenna')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="121.1" y1="462.1" x2="52.4" y2="480.5" stroke="#1C2541" stroke-width="2.5"/><line x1="121.1" y1="462.1" x2="52.4" y2="480.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'antenna')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="121.1" y1="462.1" x2="102.7" y2="530.8" stroke="#1C2541" stroke-width="2.5"/><line x1="121.1" y1="462.1" x2="102.7" y2="530.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="121.1" y1="462.1" x2="102.7" y2="393.4" stroke="#1C2541" stroke-width="2.5"/><line x1="121.1" y1="462.1" x2="102.7" y2="393.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="263.3" y1="462.1" x2="405.5" y2="462.1" stroke="#1C2541" stroke-width="2.5"/><line x1="263.3" y1="462.1" x2="405.5" y2="462.1" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="405.5" y1="462.1" x2="423.9" y2="393.4" stroke="#1C2541" stroke-width="2.5"/><line x1="405.5" y1="462.1" x2="423.9" y2="393.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="405.5" y1="462.1" x2="423.9" y2="530.8" stroke="#1C2541" stroke-width="2.5"/><line x1="405.5" y1="462.1" x2="423.9" y2="530.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="263.3" y1="462.1" x2="373.7" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="263.3" y1="462.1" x2="373.7" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="263.3" y1="462.1" x2="327.8" y2="432.1" stroke="#1C2541" stroke-width="2.5"/><line x1="263.3" y1="462.1" x2="327.8" y2="432.1" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="263.3" y1="462.1" x2="650.0" y2="642.4" stroke="#1C2541" stroke-width="2.5"/><line x1="263.3" y1="462.1" x2="650.0" y2="642.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="263.3" y1="462.1" x2="281.7" y2="530.8" stroke="#1C2541" stroke-width="2.5"/><line x1="263.3" y1="462.1" x2="281.7" y2="530.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><circle cx="121.1" cy="462.1" r="5" fill="#E8871E"/><circle cx="263.3" cy="462.1" r="5" fill="#E8871E"/><circle cx="50.0" cy="462.1" r="5" fill="#E8871E"/><circle cx="189.8" cy="480.5" r="5" fill="#E8871E"/><circle cx="52.4" cy="480.5" r="5" fill="#E8871E"/><circle cx="102.7" cy="530.8" r="5" fill="#E8871E"/><circle cx="102.7" cy="393.4" r="5" fill="#E8871E"/><circle cx="405.5" cy="462.1" r="5" fill="#E8871E"/><circle cx="423.9" cy="393.4" r="5" fill="#E8871E"/><circle cx="423.9" cy="530.8" r="5" fill="#E8871E"/><circle cx="373.7" cy="50.0" r="5" fill="#E8871E"/><circle cx="327.8" cy="432.1" r="5" fill="#E8871E"/><circle cx="650.0" cy="642.4" r="5" fill="#E8871E"/><circle cx="281.7" cy="530.8" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
