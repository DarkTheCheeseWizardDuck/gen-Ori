<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>butterfly</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>butterfly &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="593" height="700" viewBox="0 0 593 700">
<g class="edge-group"><line x1="113.5" y1="418.0" x2="240.5" y2="418.0" stroke="#1C2541" stroke-width="2.5"/><line x1="113.5" y1="418.0" x2="240.5" y2="418.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="113.5" y1="418.0" x2="97.1" y2="479.4" stroke="#1C2541" stroke-width="2.5"/><line x1="113.5" y1="418.0" x2="97.1" y2="479.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="113.5" y1="418.0" x2="50.0" y2="418.0" stroke="#1C2541" stroke-width="2.5"/><line x1="113.5" y1="418.0" x2="50.0" y2="418.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'head')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="113.5" y1="418.0" x2="129.9" y2="356.7" stroke="#1C2541" stroke-width="2.5"/><line x1="113.5" y1="418.0" x2="129.9" y2="356.7" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'antenna')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="113.5" y1="418.0" x2="129.9" y2="479.4" stroke="#1C2541" stroke-width="2.5"/><line x1="113.5" y1="418.0" x2="129.9" y2="479.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'antenna')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="113.5" y1="418.0" x2="97.1" y2="356.7" stroke="#1C2541" stroke-width="2.5"/><line x1="113.5" y1="418.0" x2="97.1" y2="356.7" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="240.5" y1="418.0" x2="339.1" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="240.5" y1="418.0" x2="339.1" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="240.5" y1="418.0" x2="290.9" y2="379.4" stroke="#1C2541" stroke-width="2.5"/><line x1="240.5" y1="418.0" x2="290.9" y2="379.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="240.5" y1="418.0" x2="367.5" y2="418.0" stroke="#1C2541" stroke-width="2.5"/><line x1="240.5" y1="418.0" x2="367.5" y2="418.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="367.5" y1="418.0" x2="384.0" y2="356.7" stroke="#1C2541" stroke-width="2.5"/><line x1="367.5" y1="418.0" x2="384.0" y2="356.7" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="367.5" y1="418.0" x2="384.0" y2="479.4" stroke="#1C2541" stroke-width="2.5"/><line x1="367.5" y1="418.0" x2="384.0" y2="479.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="240.5" y1="418.0" x2="542.8" y2="650.0" stroke="#1C2541" stroke-width="2.5"/><line x1="240.5" y1="418.0" x2="542.8" y2="650.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="240.5" y1="418.0" x2="257.0" y2="479.4" stroke="#1C2541" stroke-width="2.5"/><line x1="240.5" y1="418.0" x2="257.0" y2="479.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><circle cx="113.5" cy="418.0" r="5" fill="#E8871E"/><circle cx="240.5" cy="418.0" r="5" fill="#E8871E"/><circle cx="97.1" cy="479.4" r="5" fill="#E8871E"/><circle cx="50.0" cy="418.0" r="5" fill="#E8871E"/><circle cx="129.9" cy="356.7" r="5" fill="#E8871E"/><circle cx="129.9" cy="479.4" r="5" fill="#E8871E"/><circle cx="97.1" cy="356.7" r="5" fill="#E8871E"/><circle cx="339.1" cy="50.0" r="5" fill="#E8871E"/><circle cx="290.9" cy="379.4" r="5" fill="#E8871E"/><circle cx="367.5" cy="418.0" r="5" fill="#E8871E"/><circle cx="384.0" cy="356.7" r="5" fill="#E8871E"/><circle cx="384.0" cy="479.4" r="5" fill="#E8871E"/><circle cx="542.8" cy="650.0" r="5" fill="#E8871E"/><circle cx="257.0" cy="479.4" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
