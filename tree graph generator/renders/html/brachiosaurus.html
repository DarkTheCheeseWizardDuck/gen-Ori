<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>brachiosaurus</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>brachiosaurus &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="700" height="238" viewBox="0 0 700 238">
<g class="edge-group"><line x1="107.1" y1="132.8" x2="250.0" y2="132.8" stroke="#1C2541" stroke-width="2.5"/><line x1="107.1" y1="132.8" x2="250.0" y2="132.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="107.1" y1="132.8" x2="50.0" y2="132.8" stroke="#1C2541" stroke-width="2.5"/><line x1="107.1" y1="132.8" x2="50.0" y2="132.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'head')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="250.0" y1="132.8" x2="392.9" y2="132.8" stroke="#1C2541" stroke-width="2.5"/><line x1="250.0" y1="132.8" x2="392.9" y2="132.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="392.9" y1="132.8" x2="415.0" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="392.9" y1="132.8" x2="415.0" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="392.9" y1="132.8" x2="438.2" y2="98.0" stroke="#1C2541" stroke-width="2.5"/><line x1="392.9" y1="132.8" x2="438.2" y2="98.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="392.9" y1="132.8" x2="535.7" y2="132.8" stroke="#1C2541" stroke-width="2.5"/><line x1="392.9" y1="132.8" x2="535.7" y2="132.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="535.7" y1="132.8" x2="650.0" y2="132.8" stroke="#1C2541" stroke-width="2.5"/><line x1="535.7" y1="132.8" x2="650.0" y2="132.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'tail')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="392.9" y1="132.8" x2="460.9" y2="185.0" stroke="#1C2541" stroke-width="2.5"/><line x1="392.9" y1="132.8" x2="460.9" y2="185.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="392.9" y1="132.8" x2="407.6" y2="188.0" stroke="#1C2541" stroke-width="2.5"/><line x1="392.9" y1="132.8" x2="407.6" y2="188.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><circle cx="107.1" cy="132.8" r="5" fill="#E8871E"/><circle cx="250.0" cy="132.8" r="5" fill="#E8871E"/><circle cx="50.0" cy="132.8" r="5" fill="#E8871E"/><circle cx="392.9" cy="132.8" r="5" fill="#E8871E"/><circle cx="415.0" cy="50.0" r="5" fill="#E8871E"/><circle cx="438.2" cy="98.0" r="5" fill="#E8871E"/><circle cx="535.7" cy="132.8" r="5" fill="#E8871E"/><circle cx="650.0" cy="132.8" r="5" fill="#E8871E"/><circle cx="460.9" cy="185.0" r="5" fill="#E8871E"/><circle cx="407.6" cy="188.0" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
