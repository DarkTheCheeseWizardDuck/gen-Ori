<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>honey_bee</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>honey_bee &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="700" height="380" viewBox="0 0 700 380">
<g class="edge-group"><line x1="183.2" y1="221.5" x2="405.1" y2="221.5" stroke="#1C2541" stroke-width="2.5"/><line x1="183.2" y1="221.5" x2="405.1" y2="221.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="183.2" y1="221.5" x2="160.2" y2="307.2" stroke="#1C2541" stroke-width="2.5"/><line x1="183.2" y1="221.5" x2="160.2" y2="307.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="183.2" y1="221.5" x2="50.0" y2="221.5" stroke="#1C2541" stroke-width="2.5"/><line x1="183.2" y1="221.5" x2="50.0" y2="221.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'head')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="183.2" y1="221.5" x2="195.2" y2="176.5" stroke="#1C2541" stroke-width="2.5"/><line x1="183.2" y1="221.5" x2="195.2" y2="176.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'antenna')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="183.2" y1="221.5" x2="195.2" y2="266.5" stroke="#1C2541" stroke-width="2.5"/><line x1="183.2" y1="221.5" x2="195.2" y2="266.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'antenna')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="183.2" y1="221.5" x2="160.2" y2="135.7" stroke="#1C2541" stroke-width="2.5"/><line x1="183.2" y1="221.5" x2="160.2" y2="135.7" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="405.1" y1="221.5" x2="451.0" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="405.1" y1="221.5" x2="451.0" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="405.1" y1="221.5" x2="475.5" y2="167.5" stroke="#1C2541" stroke-width="2.5"/><line x1="405.1" y1="221.5" x2="475.5" y2="167.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="405.1" y1="221.5" x2="627.0" y2="221.5" stroke="#1C2541" stroke-width="2.5"/><line x1="405.1" y1="221.5" x2="627.0" y2="221.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="627.0" y1="221.5" x2="650.0" y2="135.7" stroke="#1C2541" stroke-width="2.5"/><line x1="627.0" y1="221.5" x2="650.0" y2="135.7" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="627.0" y1="221.5" x2="650.0" y2="307.2" stroke="#1C2541" stroke-width="2.5"/><line x1="627.0" y1="221.5" x2="650.0" y2="307.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="405.1" y1="221.5" x2="545.9" y2="329.6" stroke="#1C2541" stroke-width="2.5"/><line x1="405.1" y1="221.5" x2="545.9" y2="329.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="405.1" y1="221.5" x2="428.1" y2="307.2" stroke="#1C2541" stroke-width="2.5"/><line x1="405.1" y1="221.5" x2="428.1" y2="307.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><circle cx="183.2" cy="221.5" r="5" fill="#E8871E"/><circle cx="405.1" cy="221.5" r="5" fill="#E8871E"/><circle cx="160.2" cy="307.2" r="5" fill="#E8871E"/><circle cx="50.0" cy="221.5" r="5" fill="#E8871E"/><circle cx="195.2" cy="176.5" r="5" fill="#E8871E"/><circle cx="195.2" cy="266.5" r="5" fill="#E8871E"/><circle cx="160.2" cy="135.7" r="5" fill="#E8871E"/><circle cx="451.0" cy="50.0" r="5" fill="#E8871E"/><circle cx="475.5" cy="167.5" r="5" fill="#E8871E"/><circle cx="627.0" cy="221.5" r="5" fill="#E8871E"/><circle cx="650.0" cy="135.7" r="5" fill="#E8871E"/><circle cx="650.0" cy="307.2" r="5" fill="#E8871E"/><circle cx="545.9" cy="329.6" r="5" fill="#E8871E"/><circle cx="428.1" cy="307.2" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
