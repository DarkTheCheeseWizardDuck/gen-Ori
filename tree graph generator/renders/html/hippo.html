<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>hippo</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>hippo &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="700" height="293" viewBox="0 0 700 293">
<g class="edge-group"><line x1="200.0" y1="146.6" x2="600.0" y2="146.6" stroke="#1C2541" stroke-width="2.5"/><line x1="200.0" y1="146.6" x2="600.0" y2="146.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="200.0" y1="146.6" x2="174.1" y2="243.2" stroke="#1C2541" stroke-width="2.5"/><line x1="200.0" y1="146.6" x2="174.1" y2="243.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="200.0" y1="146.6" x2="50.0" y2="146.6" stroke="#1C2541" stroke-width="2.5"/><line x1="200.0" y1="146.6" x2="50.0" y2="146.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'head')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="200.0" y1="146.6" x2="174.1" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="200.0" y1="146.6" x2="174.1" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="600.0" y1="146.6" x2="625.9" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="600.0" y1="146.6" x2="625.9" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="600.0" y1="146.6" x2="650.0" y2="146.6" stroke="#1C2541" stroke-width="2.5"/><line x1="600.0" y1="146.6" x2="650.0" y2="146.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'tail')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="600.0" y1="146.6" x2="625.9" y2="243.2" stroke="#1C2541" stroke-width="2.5"/><line x1="600.0" y1="146.6" x2="625.9" y2="243.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><circle cx="200.0" cy="146.6" r="5" fill="#E8871E"/><circle cx="600.0" cy="146.6" r="5" fill="#E8871E"/><circle cx="174.1" cy="243.2" r="5" fill="#E8871E"/><circle cx="50.0" cy="146.6" r="5" fill="#E8871E"/><circle cx="174.1" cy="50.0" r="5" fill="#E8871E"/><circle cx="625.9" cy="50.0" r="5" fill="#E8871E"/><circle cx="650.0" cy="146.6" r="5" fill="#E8871E"/><circle cx="625.9" cy="243.2" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
