<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>bird</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>bird &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="700" height="431" viewBox="0 0 700 431">
<g class="edge-group"><line x1="135.7" y1="215.6" x2="335.7" y2="215.6" stroke="#1C2541" stroke-width="2.5"/><line x1="135.7" y1="215.6" x2="335.7" y2="215.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="135.7" y1="215.6" x2="50.0" y2="215.6" stroke="#1C2541" stroke-width="2.5"/><line x1="135.7" y1="215.6" x2="50.0" y2="215.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'head')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="335.7" y1="215.6" x2="380.1" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="335.7" y1="215.6" x2="380.1" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="335.7" y1="215.6" x2="535.7" y2="215.6" stroke="#1C2541" stroke-width="2.5"/><line x1="335.7" y1="215.6" x2="535.7" y2="215.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="535.7" y1="215.6" x2="565.3" y2="105.2" stroke="#1C2541" stroke-width="2.5"/><line x1="535.7" y1="215.6" x2="565.3" y2="105.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="535.7" y1="215.6" x2="650.0" y2="215.6" stroke="#1C2541" stroke-width="2.5"/><line x1="535.7" y1="215.6" x2="650.0" y2="215.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'tail')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="535.7" y1="215.6" x2="565.3" y2="326.0" stroke="#1C2541" stroke-width="2.5"/><line x1="535.7" y1="215.6" x2="565.3" y2="326.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="335.7" y1="215.6" x2="380.1" y2="381.2" stroke="#1C2541" stroke-width="2.5"/><line x1="335.7" y1="215.6" x2="380.1" y2="381.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><circle cx="135.7" cy="215.6" r="5" fill="#E8871E"/><circle cx="335.7" cy="215.6" r="5" fill="#E8871E"/><circle cx="50.0" cy="215.6" r="5" fill="#E8871E"/><circle cx="380.1" cy="50.0" r="5" fill="#E8871E"/><circle cx="535.7" cy="215.6" r="5" fill="#E8871E"/><circle cx="565.3" cy="105.2" r="5" fill="#E8871E"/><circle cx="650.0" cy="215.6" r="5" fill="#E8871E"/><circle cx="565.3" cy="326.0" r="5" fill="#E8871E"/><circle cx="380.1" cy="381.2" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
