<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>dragonfly</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>dragonfly &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="700" height="597" viewBox="0 0 700 597">
<g class="edge-group"><line x1="135.7" y1="298.4" x2="264.3" y2="298.4" stroke="#1C2541" stroke-width="2.5"/><line x1="135.7" y1="298.4" x2="264.3" y2="298.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="135.7" y1="298.4" x2="113.5" y2="381.2" stroke="#1C2541" stroke-width="2.5"/><line x1="135.7" y1="298.4" x2="113.5" y2="381.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="135.7" y1="298.4" x2="50.0" y2="298.4" stroke="#1C2541" stroke-width="2.5"/><line x1="135.7" y1="298.4" x2="50.0" y2="298.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'head')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="135.7" y1="298.4" x2="113.5" y2="215.6" stroke="#1C2541" stroke-width="2.5"/><line x1="135.7" y1="298.4" x2="113.5" y2="215.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="264.3" y1="298.4" x2="330.8" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="264.3" y1="298.4" x2="330.8" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="264.3" y1="298.4" x2="319.4" y2="232.7" stroke="#1C2541" stroke-width="2.5"/><line x1="264.3" y1="298.4" x2="319.4" y2="232.7" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="264.3" y1="298.4" x2="497.3" y2="189.7" stroke="#1C2541" stroke-width="2.5"/><line x1="264.3" y1="298.4" x2="497.3" y2="189.7" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="264.3" y1="298.4" x2="392.9" y2="298.4" stroke="#1C2541" stroke-width="2.5"/><line x1="264.3" y1="298.4" x2="392.9" y2="298.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="392.9" y1="298.4" x2="415.0" y2="215.6" stroke="#1C2541" stroke-width="2.5"/><line x1="392.9" y1="298.4" x2="415.0" y2="215.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="392.9" y1="298.4" x2="650.0" y2="298.4" stroke="#1C2541" stroke-width="2.5"/><line x1="392.9" y1="298.4" x2="650.0" y2="298.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'tail')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="392.9" y1="298.4" x2="415.0" y2="381.2" stroke="#1C2541" stroke-width="2.5"/><line x1="392.9" y1="298.4" x2="415.0" y2="381.2" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="264.3" y1="298.4" x2="497.3" y2="407.1" stroke="#1C2541" stroke-width="2.5"/><line x1="264.3" y1="298.4" x2="497.3" y2="407.1" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="264.3" y1="298.4" x2="319.4" y2="364.0" stroke="#1C2541" stroke-width="2.5"/><line x1="264.3" y1="298.4" x2="319.4" y2="364.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="264.3" y1="298.4" x2="330.8" y2="546.8" stroke="#1C2541" stroke-width="2.5"/><line x1="264.3" y1="298.4" x2="330.8" y2="546.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><circle cx="135.7" cy="298.4" r="5" fill="#E8871E"/><circle cx="264.3" cy="298.4" r="5" fill="#E8871E"/><circle cx="113.5" cy="381.2" r="5" fill="#E8871E"/><circle cx="50.0" cy="298.4" r="5" fill="#E8871E"/><circle cx="113.5" cy="215.6" r="5" fill="#E8871E"/><circle cx="330.8" cy="50.0" r="5" fill="#E8871E"/><circle cx="319.4" cy="232.7" r="5" fill="#E8871E"/><circle cx="497.3" cy="189.7" r="5" fill="#E8871E"/><circle cx="392.9" cy="298.4" r="5" fill="#E8871E"/><circle cx="415.0" cy="215.6" r="5" fill="#E8871E"/><circle cx="650.0" cy="298.4" r="5" fill="#E8871E"/><circle cx="415.0" cy="381.2" r="5" fill="#E8871E"/><circle cx="497.3" cy="407.1" r="5" fill="#E8871E"/><circle cx="319.4" cy="364.0" r="5" fill="#E8871E"/><circle cx="330.8" cy="546.8" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
