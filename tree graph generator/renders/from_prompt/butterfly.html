<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>butterfly</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; color: #1C2541; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; display: none; background: #1C2541; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; z-index: 10;
  }
  line { cursor: pointer; }
</style>
</head>
<body>
<h1>butterfly &mdash; hover an edge to see its name</h1>
<div id="tooltip"></div>
<svg width="700" height="653" viewBox="0 0 700 653">
<g class="edge-group"><line x1="164.9" y1="434.4" x2="289.3" y2="434.4" stroke="#1C2541" stroke-width="2.5"/><line x1="164.9" y1="434.4" x2="289.3" y2="434.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="164.9" y1="434.4" x2="65.5" y2="434.4" stroke="#1C2541" stroke-width="2.5"/><line x1="164.9" y1="434.4" x2="65.5" y2="434.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'head')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="65.5" y1="434.4" x2="50.0" y2="492.1" stroke="#1C2541" stroke-width="2.5"/><line x1="65.5" y1="434.4" x2="50.0" y2="492.1" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'antenna')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="65.5" y1="434.4" x2="50.0" y2="376.8" stroke="#1C2541" stroke-width="2.5"/><line x1="65.5" y1="434.4" x2="50.0" y2="376.8" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'antenna')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="164.9" y1="434.4" x2="152.1" y2="482.5" stroke="#1C2541" stroke-width="2.5"/><line x1="164.9" y1="434.4" x2="152.1" y2="482.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="164.9" y1="434.4" x2="152.1" y2="386.4" stroke="#1C2541" stroke-width="2.5"/><line x1="164.9" y1="434.4" x2="152.1" y2="386.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="289.3" y1="434.4" x2="413.7" y2="434.4" stroke="#1C2541" stroke-width="2.5"/><line x1="289.3" y1="434.4" x2="413.7" y2="434.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'body')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="413.7" y1="434.4" x2="426.6" y2="386.4" stroke="#1C2541" stroke-width="2.5"/><line x1="413.7" y1="434.4" x2="426.6" y2="386.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="413.7" y1="434.4" x2="426.6" y2="482.5" stroke="#1C2541" stroke-width="2.5"/><line x1="413.7" y1="434.4" x2="426.6" y2="482.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="289.3" y1="434.4" x2="392.3" y2="50.0" stroke="#1C2541" stroke-width="2.5"/><line x1="289.3" y1="434.4" x2="392.3" y2="50.0" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="289.3" y1="434.4" x2="334.4" y2="413.4" stroke="#1C2541" stroke-width="2.5"/><line x1="289.3" y1="434.4" x2="334.4" y2="413.4" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="289.3" y1="434.4" x2="650.0" y2="602.6" stroke="#1C2541" stroke-width="2.5"/><line x1="289.3" y1="434.4" x2="650.0" y2="602.6" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'wing')" onmouseleave="hideTip()"/></g><g class="edge-group"><line x1="289.3" y1="434.4" x2="302.2" y2="482.5" stroke="#1C2541" stroke-width="2.5"/><line x1="289.3" y1="434.4" x2="302.2" y2="482.5" stroke="#1C2541" stroke-width="14" opacity="0" onmouseenter="showTip(event, 'leg')" onmouseleave="hideTip()"/></g><circle cx="164.9" cy="434.4" r="5" fill="#E8871E"/><circle cx="289.3" cy="434.4" r="5" fill="#E8871E"/><circle cx="65.5" cy="434.4" r="5" fill="#E8871E"/><circle cx="50.0" cy="492.1" r="5" fill="#E8871E"/><circle cx="50.0" cy="376.8" r="5" fill="#E8871E"/><circle cx="152.1" cy="482.5" r="5" fill="#E8871E"/><circle cx="152.1" cy="386.4" r="5" fill="#E8871E"/><circle cx="413.7" cy="434.4" r="5" fill="#E8871E"/><circle cx="426.6" cy="386.4" r="5" fill="#E8871E"/><circle cx="426.6" cy="482.5" r="5" fill="#E8871E"/><circle cx="392.3" cy="50.0" r="5" fill="#E8871E"/><circle cx="334.4" cy="413.4" r="5" fill="#E8871E"/><circle cx="650.0" cy="602.6" r="5" fill="#E8871E"/><circle cx="302.2" cy="482.5" r="5" fill="#E8871E"/>
</svg>
<script>
function showTip(evt, text) {
  const t = document.getElementById('tooltip');
  t.textContent = text;
  t.style.left = (evt.clientX + 14) + 'px';
  t.style.top = (evt.clientY + 14) + 'px';
  t.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
</script>
</body>
</html>
